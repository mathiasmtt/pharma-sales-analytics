[project]
name = "pharma-sales-analytics"
version = "0.1.0"
description = "Demo de analítica comercial sobre el dataset Pharma Sales (Milan Zdravkovic)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.36",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
